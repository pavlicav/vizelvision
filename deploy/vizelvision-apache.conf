# VizelVision master control behind the existing Apache server.
# The trailing slash matters because browser assets and API calls are relative.
RedirectMatch 301 ^/vizelvision$ /vizelvision/

ProxyPass        /vizelvision/ http://127.0.0.1:6970/ flushpackets=on timeout=3600 retry=0
ProxyPassReverse /vizelvision/ http://127.0.0.1:6970/
