# Ads 5 at http://viviserv/ads5/ (vizelvision-ads5.service on 127.0.0.1:6975; it serves its
# page, API and stream under /ads5/ itself, so the prefix passes through unchanged).
# Install (sudo will prompt):
#   sudo cp ~/vizelVision/deploy/ads5-apache.conf /etc/apache2/conf-available/ads5.conf
#   sudo a2enconf ads5 && sudo apache2ctl configtest && sudo systemctl reload apache2
RedirectMatch 301 ^/ads5$ /ads5/
ProxyPass        /ads5/  http://127.0.0.1:6975/ads5/  flushpackets=on retry=0
ProxyPassReverse /ads5/  http://127.0.0.1:6975/ads5/
