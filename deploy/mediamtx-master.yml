# Dedicated local master output; expose HLS through the existing web proxy later.
logLevel: info
rtsp: yes
rtspAddress: 127.0.0.1:18554
rtspTransports: [tcp]
hls: yes
hlsAddress: 127.0.0.1:18888
hlsVariant: fmp4
hlsAlwaysRemux: yes
hlsSegmentCount: 30
hlsSegmentDuration: 1s
hlsSegmentMaxSize: 8M
hlsDirectory: ''
api: yes
apiAddress: 127.0.0.1:19997
rtmp: no
webrtc: no
srt: no
moq: no
playback: no
metrics: no
pprof: no
authInternalUsers:
  - user: any
    ips: [127.0.0.1]
    permissions:
      - action: publish
        path: master
      - action: read
        path: master
      # The low rendition (roku_stream/master_low.py), for phones on cell networks.
      - action: publish
        path: master_low
      - action: read
        path: master_low
      - action: api
paths:
  master:
    source: publisher
    overridePublisher: no
    record: no
  # Same HLS settings (they are global). Its keyframes come every 2 s, so its segments do.
  master_low:
    source: publisher
    overridePublisher: no
    record: no
