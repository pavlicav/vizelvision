<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sources · VizelVision</title>
<link rel="stylesheet" href="static/ui/vv.css"><link rel="stylesheet" href="static/ui/testcard.css">
<style>
.src{display:grid;grid-template-columns:200px minmax(0,1fr) 360px;gap:var(--gap);align-items:start}
.srcnav{display:grid;gap:4px;position:sticky;top:calc(var(--top) + 16px)}
.srcnav button{height:auto;justify-content:flex-start;text-align:left;padding:9px 11px;display:grid;gap:2px;background:none;border-color:transparent}
.srcnav button strong{font-weight:600;font-size:14px}
.srcnav button small{color:var(--muted);font-size:12px;white-space:normal}
.srcnav button[aria-pressed=true]{background:var(--raised);border-color:var(--line-2);box-shadow:inset 3px 0 0 var(--touch)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar h1{font:800 30px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin-right:auto}
.toolbar .search{width:min(320px,100%)}
#source-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.input-card .screen{margin:0}
.input-card[data-live=true]{border-color:var(--pgm-line)}
.input-card .test-card{margin:0}
.guide-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.guide-head h2{font:700 20px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.grow-row{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);gap:14px;padding:11px 16px;border-top:1px solid var(--line);align-items:start}
.grow-row:first-child{border-top:0}
.grow-row .ch strong{display:block;font:600 15px/1.2 var(--body)}
.grow-row .ch small{color:var(--muted);font-size:12px}
.prog{display:grid;gap:2px;min-width:0}
.prog strong{font-weight:500;overflow-wrap:anywhere}
.prog small{color:var(--muted);font-size:12.5px}
.prog .meter{margin-top:4px;max-width:260px}
.grow-row details summary{cursor:pointer;color:var(--touch);font-size:12.5px;margin-top:4px}
.grow-row details li{padding:6px 0;border-top:1px solid var(--line);font-size:13px;display:grid;gap:4px}
.grow-row details ul{list-style:none;margin:6px 0 0;padding:0}
.media{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.media[data-live=true]{box-shadow:inset 3px 0 0 var(--pgm)}
.media strong{display:block;font-weight:500}.media small{display:block;color:var(--muted);font-size:12.5px}
.collection{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--well);border-top:1px solid var(--line)}
.collection h3{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
#queue-jump{display:none}
@media (max-width:1380px){.src{grid-template-columns:180px minmax(0,1fr)}#queue-host{grid-column:1/-1}#queue-jump{display:inline-flex}}
@media (max-width:860px){.src{grid-template-columns:1fr}.srcnav{position:static;display:flex;overflow-x:auto;gap:4px}.srcnav button{flex:none}.srcnav button small{display:none}
  .grow-row{grid-template-columns:1fr 1fr}.grow-row .ch{grid-column:1/-1}.media{grid-template-columns:1fr}}
@media (max-width:520px){.grow-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar" data-page="sources"></header><script src="static/ui/vv.js"></script>
<script src="static/ui/testcard.js"></script><script src="static/ui/onair.js"></script><script src="static/ui/queue.js"></script>
<main class="page">
  <div class="src">
    <nav class="srcnav" id="sources" aria-label="Browse sources"></nav>
    <div class="stack" id="workspace">
      <div class="toolbar"><h1 id="heading">All sources</h1>
        <input class="search" id="search" type="search" data-search placeholder="Find a channel or program  ( / )" aria-label="Find a channel or program">
        <button class="sm" id="refresh" type="button">Refresh listings</button>
        <a class="btn sm" id="queue-jump" href="#queue-host">Up next ↓</a></div>
      <p id="status" class="tiny muted" role="status" aria-live="polite">Loading sources…</p>
      <section id="source-cards" aria-label="Source previews"></section>
      <div id="roku-host"></div>
      <div id="guide" class="stack"></div>
      <section id="sports-view" class="stack" aria-label="Sports schedule" hidden></section>
    </div>
    <aside id="queue-host" aria-label="Up next"></aside>
  </div>
</main>
<script src="static/ui/sources.js"></script>
</body>
</html>
